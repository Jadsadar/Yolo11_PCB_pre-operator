# Experiment defaults for learning, not accuracy acceptance criteria.
data: ../data.yaml
model: ../models/pretrained/yolo11n.pt
epochs: 100
batch: 8
imgsz: 640
optimizer: AdamW
lr0: 0.001
patience: 20
seed: 42
deterministic: true
device: 0  # First NVIDIA CUDA GPU; use cpu for machines without CUDA.
workers: 0
amp: false
cache: false
plots: true
val: true  # Validate every epoch for per-class progress logging.
tensorboard: true
project: ../experiments
name: pcb_yolo11n
# Conservative augmentation. Adjust on validation, never using test to tune.
degrees: 5.0
translate: 0.05
scale: 0.2
fliplr: 0.5
flipud: 0.0
hsv_h: 0.015
hsv_s: 0.3
hsv_v: 0.2
mosaic: 0.0
mixup: 0.0
